<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DuduChat</title>

<link rel="stylesheet" href="estilo.css">

<script type="module" src="chat.js" defer></script>

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h2>DuduChat</h2>

        <div id="userInfo"></div>

        <button id="logoutBtn">
            Sair
        </button>

    </aside>

    <main class="chatArea">

        <div class="chatHeader">
            Chat
        </div>

        <div id="messages">

            <div class="message">
                Bem-vindo ao DuduChat 🚀
            </div>

        </div>

    </main>

</div>

</body>
</html>
