<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuduChat</title>

  <link rel="stylesheet" href="style.css">

 <script type="module" src="app.js" defer></script>
</head>
<body>

<div class="login-container">

  <div class="login-card">

    <h1>DuduChat</h1>
    <p>Entre para conversar</p>

    <input
      type="email"
      id="email"
      placeholder="Email">

    <input
      type="password"
      id="senha"
      placeholder="Senha">

    <button id="loginBtn">
      Entrar
    </button>

    <p id="erro"></p>

  </div>

</div>

</body>
</html>
